name: Compare local PostgreSQL CDC write costs
on:
  push:
    branches: [verify-cdc-write-latency-20261125]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start PostgreSQL 18 with logical decoding
        run: |
          docker run --detach --name cdc-write-pg --publish 127.0.0.1:5432:5432 --env POSTGRES_HOST_AUTH_METHOD=trust postgres:18 -c wal_level=logical
          for i in $(seq 1 45); do
            if PGUSER=postgres PGHOST=127.0.0.1 pg_isready -q; then exit 0; fi
            sleep 1
          done
          docker logs cdc-write-pg
          exit 1
      - name: Time paired source writes and verify both histories
        run: |
          python -m pip install -q "psycopg[binary]>=3.2,<4"
          python verify_cdc_write.py | tee write-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paired-postgres-write-timings
          retention-days: 7
          path: |
            write-timings.json
            write-summary.txt

bundle:
  name: news-202620-truncate
  databricks_cli_version: ">= 1.20.0"
  engine: direct

workspace:
  host: https://dbc-ca93cffe-fba0.cloud.databricks.com

resources:
  jobs:
    demo:
      name: news-202620-truncate
      max_concurrent_runs: 1
      timeout_seconds: 900
      performance_target: STANDARD
      environments:
        - environment_key: env6
          spec:
            environment_version: "6"
      tasks:
        - task_key: 01_truncate
          environment_key: env6
          max_retries: 0
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ./src/01_truncate.sql

targets:
  dev:
    default: true
    mode: development

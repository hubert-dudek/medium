resources:
  jobs:
    initialize_job:
      name: news_202620_dabs_01_initial_setup
      performance_target: STANDARD
      timeout_seconds: 600
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: initialize
          environment_key: default
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/initialize.py

  job_runs:
    initialize:
      job_id: ${resources.jobs.initialize_job.id}
      job_parameters:
        catalog: ${var.catalog}
        schema: ${var.schema}

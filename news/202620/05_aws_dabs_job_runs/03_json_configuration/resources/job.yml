resources:
  jobs:
    merge_configuration_job:
      name: news_202620_dabs_03_json_configuration
      performance_target: STANDARD
      timeout_seconds: 600
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: merge_configuration
          environment_key: default
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/merge_configuration.py
            base_parameters:
              config_path: ${workspace.file_path}/config/application.json

  job_runs:
    merge_configuration:
      job_id: ${resources.jobs.merge_configuration_job.id}
      job_parameters:
        catalog: ${var.catalog}
        schema: ${var.schema}
      lifecycle:
        triggers:
          - on_file_change: ../config/application.json
          - on_file_change: ../notebooks/merge_configuration.py

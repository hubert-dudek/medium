resources:
  jobs:
    validation_job:
      name: news_202620_dabs_validate_candidate
      performance_target: STANDARD
      timeout_seconds: 600
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      tasks:
        - task_key: validate_candidate
          environment_key: default
          max_retries: 0
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../notebooks/candidate.py

    production_job:
      name: news_202620_dabs_production
      performance_target: STANDARD
      timeout_seconds: 600
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      tags:
        validation_result: ${resources.job_runs.validate_candidate.state.result_state}
      tasks:
        - task_key: transform_data
          environment_key: default
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/candidate.py

  job_runs:
    validate_candidate:
      job_id: ${resources.jobs.validation_job.id}
      lifecycle:
        triggers:
          - on_bundle_deploy: true

bundle:
  name: news_202621_ai_functions
  engine: direct

variables:
  catalog:
    description: Catalog containing the support tickets.
  schema:
    default: news_202621_ai_functions

resources:
  jobs:
    classify_tickets:
      name: news_202621_classify_tickets
      tasks:
        - task_key: classify
          ai_function_task:
            delta_table:
              table_name: ${var.catalog}.${var.schema}.tickets
              input_column: body
              merge_key_columns: [id]
            output:
              catalog: ${var.catalog}
              schema: ${var.schema}
              table: ticket_labels
            ai_classify:
              version: '2.1'
              inline_labels:
                labels:
                  - name: billing
                  - name: technical

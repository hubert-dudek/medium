bundle:
  name: news_202621_materialization
  engine: direct
  databricks_cli_version: ">= 1.24.0"

variables:
  catalog:
    description: Catalog containing the transactions table.
  schema:
    default: news_202621_materialization

resources:
  features:
    txn_count:
      full_name: ${var.catalog}.${var.schema}.transaction_count_7d
      source:
        delta_table_source:
          full_name: ${var.catalog}.${var.schema}.transactions
      function:
        aggregation_function:
          count_function:
            input: amount
          time_window:
            sliding:
              window_duration: 604800s
              slide_duration: 86400s
      entities:
        - name: customer_id
      timeseries_column:
        name: event_ts

  materialization_sets:
    customer_features:
      materialized_features:
        - feature_name: ${resources.features.txn_count.full_name}
          offline_store_config:
            catalog_name: ${var.catalog}
            schema_name: ${var.schema}
            table_name_prefix: customer_features
          cron_schedule_trigger:
            mode: MANUAL
            cron_expression: "0 0 0 * * ?"
            timezone_id: UTC

targets:
  dev:
    default: true

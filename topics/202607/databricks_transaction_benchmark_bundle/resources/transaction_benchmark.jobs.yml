resources:
  jobs:
    create_1m:
      name: transaction_benchmark_create_1m
      description: Create and fully optimize the 1 million row transaction dataset.
      max_concurrent_runs: 1
      tags:
        project: transaction_sql_benchmark
        scale: 1m
        phase: create
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: schema
        default: ${var.schema_prefix}_1m
      tasks:
      - task_key: create_tables
        sql_task:
          warehouse_id: ${var.warehouse_id}
          file:
            path: ../src/create_dataset_1m.sql
      - task_key: optimize_full
        depends_on:
        - task_key: create_tables
        sql_task:
          warehouse_id: ${var.warehouse_id}
          file:
            path: ../src/optimize_full.sql

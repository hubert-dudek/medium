resources:
  jobs:
    record_deployment_job:
      name: job_runs_article_02_every_deployment
      performance_target: PERFORMANCE_OPTIMIZED
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: record_deployment
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/record_deployment.py

  job_runs:
    record_deployment:
      job_id: ${resources.jobs.record_deployment_job.id}
      job_parameters:
        catalog: ${var.catalog}
        schema: ${var.schema}
      lifecycle:
        triggers:
          - on_bundle_deploy: true

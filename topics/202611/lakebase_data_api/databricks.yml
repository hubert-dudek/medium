bundle:
  name: lakebase-data-api

variables:
  project_id:
    default: lakebase-data-api-example
  catalog_id:
    default: lakebase_data_api_example

targets:
  dev:
    default: true

resources:
  postgres_projects:
    demo:
      project_id: ${var.project_id}
      display_name: ${var.project_id}
      pg_version: 18
      default_endpoint_settings:
        autoscaling_limit_min_cu: 1
        autoscaling_limit_max_cu: 1
        suspend_timeout_duration: 60s

  postgres_data_apis:
    orders_api:
      parent: ${resources.postgres_projects.demo.name}/branches/production/databases/databricks-postgres
      db_schemas: [public]
      db_max_rows: 50

  postgres_catalogs:
    orders_catalog:
      catalog_id: ${var.catalog_id}
      branch: ${resources.postgres_projects.demo.name}/branches/production
      postgres_database: databricks_postgres

bundle:
  name: run_as_group
  databricks_cli_version: ">= 1.20.0"
  engine: direct

variables:
  group_name:
    default: medium-run-as-demo
  catalog:
    default: workspace

run_as:
  group_name: ${var.group_name}

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

permissions:
  - group_name: ${var.group_name}
    level: CAN_VIEW

resources:
  jobs:
    group_job:
      name: run-as-group-${bundle.target}
      timeout_seconds: 600
      max_concurrent_runs: 1
      tasks:
        - task_key: identity
          notebook_task:
            notebook_path: ./src/01_identity.sql
    user_override:
      name: run-as-user-override-${bundle.target}
      run_as:
        user_name: ${workspace.current_user.userName}
      timeout_seconds: 600
      tasks:
        - task_key: identity
          notebook_task:
            notebook_path: ./src/01_identity.sql
  pipelines:
    group_pipeline:
      name: run-as-group-pipeline-${bundle.target}
      catalog: ${var.catalog}
      schema: medium_run_as_group_${bundle.target}
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ./src/02_pipeline.sql

targets:
  bundle_level:
    default: true
    mode: development
  target_level:
    mode: development
    run_as:
      group_name: ${var.group_name}


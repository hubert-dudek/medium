bundle:
  name: parse_sql_experiments

resources:
  jobs:
    parse_sql_experiments:
      name: parse_sql_experiments
      max_concurrent_runs: 1
      timeout_seconds: 900
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
      tasks:
        - task_key: select_examples
          environment_key: default
          notebook_task:
            notebook_path: ./src/01_select.sql
          max_retries: 0
        - task_key: cte_join
          environment_key: default
          notebook_task:
            notebook_path: ./src/02_cte_join.sql
          max_retries: 0
        - task_key: merge
          environment_key: default
          notebook_task:
            notebook_path: ./src/03_merge.sql
          max_retries: 0

targets:
  dev:
    default: true
    mode: development

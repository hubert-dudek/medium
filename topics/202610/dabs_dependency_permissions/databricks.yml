bundle:
  name: news_access_dependencies
  engine: direct
  databricks_cli_version: ">= 1.26.0"

resources:
  jobs:
    source:
      name: news_access_source
      permissions:
        - user_name: ${workspace.current_user.userName}
          level: CAN_MANAGE
    consumer:
      name: news_access_consumer
      lifecycle:
        depends_on:
          - resource: jobs.source.permissions

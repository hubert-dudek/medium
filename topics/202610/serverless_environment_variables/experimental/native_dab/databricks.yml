# Validation probe only. Do not deploy this bundle while the fields are unknown.
bundle:
  name: serverless_env_native_schema_probe

resources:
  jobs:
    probe:
      name: serverless_env_native_schema_probe
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
      environment_variables:
        - environment_variables_key: app_config
          spec:
            variables:
              APP_ENV: development
      tasks:
        - task_key: probe
          environment_key: default
          environment_variables_key: app_config
          notebook_task:
            notebook_path: ./probe.py

targets:
  dev:
    default: true
    mode: development

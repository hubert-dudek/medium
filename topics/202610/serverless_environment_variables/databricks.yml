bundle:
  name: serverless_environment_variables

resources:
  jobs:
    env_demo:
      name: serverless_environment_variables_demo
      max_concurrent_runs: 1
      timeout_seconds: 900
      environment_variables:
        - environment_variables_key: app_config
          spec:
            variables:
              APP_ENV: development
              LOG_LEVEL: INFO
        - environment_variables_key: file_config
          spec:
            files:
              - ${workspace.file_path}/config/application.env
        - environment_variables_key: combined_config
          spec:
            variables:
              APP_ENV: staging
              LOG_LEVEL: DEBUG
              ARTICLE_ENV_MARKER: serverless-env-demo
              BATCH_SIZE: "250"
              ENABLE_EXPORT: "true"
            files:
              - ${workspace.file_path}/config/application.env
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
      tasks:
        - task_key: inline_variables
          environment_key: default
          environment_variables_key: app_config
          notebook_task:
            notebook_path: ./src/01_simple.py
        - task_key: file_variables
          environment_key: default
          environment_variables_key: file_config
          notebook_task:
            notebook_path: ./src/01_simple.py
        - task_key: file_with_overrides
          environment_key: default
          environment_variables_key: combined_config
          notebook_task:
            notebook_path: ./src/01_simple.py
        - task_key: import_settings
          environment_key: default
          environment_variables_key: app_config
          notebook_task:
            notebook_path: ./src/02_import_settings.py
        - task_key: typed_config
          environment_key: default
          environment_variables_key: combined_config
          notebook_task:
            notebook_path: ./src/03_typed_config.py
        - task_key: udf_boundary
          environment_key: default
          environment_variables_key: combined_config
          notebook_task:
            notebook_path: ./src/04_udf_boundary.py
        - task_key: without_entry
          environment_key: default
          notebook_task:
            notebook_path: ./src/05_without_entry.py

targets:
  dev:
    default: true
    mode: development

bundle:
  name: serverless_environment_variables

resources:
  jobs:
    env_demo:
      name: serverless_environment_variables_demo
      description: Simple Python examples for serverless environment variables. Configure app_config in the job UI after deployment.
      max_concurrent_runs: 1
      timeout_seconds: 900
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
      tasks:
        - task_key: simple
          environment_key: default
          notebook_task:
            notebook_path: ./src/01_simple.py
        - task_key: import_settings
          environment_key: default
          notebook_task:
            notebook_path: ./src/02_import_settings.py
        - task_key: typed_config
          environment_key: default
          notebook_task:
            notebook_path: ./src/03_typed_config.py
        - task_key: udf_boundary
          environment_key: default
          notebook_task:
            notebook_path: ./src/04_udf_boundary.py
        - task_key: without_entry
          environment_key: default
          notebook_task:
            notebook_path: ./src/05_without_entry.py

sync:
  exclude:
    - examples/**
    - evidence/**
    - images/**
    - "*.md"

targets:
  dev:
    default: true
    mode: development
